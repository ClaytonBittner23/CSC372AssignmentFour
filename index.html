<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>

     <header>
        <h1>TVmaze Show Gallery</h1>
    </header>

    <main>
        <section class="search-section">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Enter a TV show...">
                <button type="submit">Search</button>
            </form>
        </section>

        <p id="status-message"></p>

        <section id="show-gallery" class="show-gallery">
            <!-- Section for the gallery cards to be filled in here-->
        </section>
    </main>

    <footer>
            <a href="https://www.tvmaze.com/">Data Used from the TVmaze API All Credit to Them</a>
    </footer>

    
</body>
</html>
